apiVersion: v1
kind: Pod
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  labels:
    app: discobats-server
  name: discobats-server
  namespace: default
spec:
  containers:
    - image: skatze/discobats:server_alpine
      imagePullPolicy: Always
      name: discobats
      resources:
        requests:
          cpu: "5"
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
      tty: true
      stdin: true
      ports:
        - name: remotedebugging
          containerPort: 5005
          protocol: TCP
  serviceAccountName: discobats
  dnsPolicy: ClusterFirst
  restartPolicy: Never
